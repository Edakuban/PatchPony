# Local-only integration overlay: Open WebUI -> n8n -> PatchPony Gateway.
# Start it only together with docker-compose.yml; never use it for production.
services:
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${PATCHPONY_LOCAL_N8N_PORT:-5678}
      N8N_ENCRYPTION_KEY: ${PATCHPONY_LOCAL_N8N_ENCRYPTION_KEY:?Set PATCHPONY_LOCAL_N8N_ENCRYPTION_KEY in .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # The imported read-only workflow resolves only PATCHPONY_GATEWAY_URL via $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
      # The n8n MCP client reaches the Gateway over the private Compose network.
      PATCHPONY_GATEWAY_URL: http://gateway:8080
    ports:
      - "127.0.0.1:${PATCHPONY_LOCAL_N8N_PORT:-5678}:5678"
    volumes:
      - patchpony-n8n-data:/home/node/.n8n
    networks:
      - edge

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      WEBUI_SECRET_KEY: ${PATCHPONY_LOCAL_OWUI_SECRET_KEY:?Set PATCHPONY_LOCAL_OWUI_SECRET_KEY in .env}
      ENABLE_SIGNUP: "true"
    ports:
      - "127.0.0.1:${PATCHPONY_LOCAL_OWUI_PORT:-3000}:8080"
    volumes:
      - patchpony-open-webui-data:/app/backend/data
    networks:
      - edge

volumes:
  patchpony-n8n-data:
  patchpony-open-webui-data: