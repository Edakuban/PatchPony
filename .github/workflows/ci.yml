name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  build-test-containers:
    name: Build, test, scan and attest containers
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore PatchPony.slnx

      - name: Scan direct and transitive NuGet dependencies
        run: |
          mkdir -p artifacts
          dotnet package list PatchPony.slnx --vulnerable --include-transitive --format json > artifacts/nuget-vulnerabilities.json
          jq -e '[.. | objects | .vulnerabilities? // empty | .[]?] | length == 0' artifacts/nuget-vulnerabilities.json

      - name: Build
        run: dotnet build PatchPony.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PatchPony.slnx --configuration Release --no-build --no-restore

      - name: Validate local Compose and Caddy TLS configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          PATCHPONY_AUTH__N8N__TOKEN: ci-n8n-token
          PATCHPONY_WORKER__CLAIMSIGNINGKEY: cGF0Y2hwb255LWNpLXdvcmtlci1jbGFpbS1zaWduaW5nLWtleS0zMmJ5dGVz
        run: |
          docker compose --env-file .env.example config --quiet
          docker run --rm --mount type=bind,source=${{ github.workspace }}/deploy/caddy/Caddyfile.local,target=/etc/caddy/Caddyfile,readonly caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build gateway container
        run: docker build --file src/PatchPony.Gateway/Dockerfile --tag patchpony-gateway:ci .

      - name: Build worker container
        run: docker build --file src/PatchPony.Worker/Dockerfile --tag patchpony-worker:ci .

      - name: Scan gateway container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: patchpony-gateway:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          timeout: 10m0s

      - name: Scan worker container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: patchpony-worker:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          timeout: 10m0s
          skip-setup-trivy: true

      - name: Generate gateway CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: patchpony-gateway:ci
          format: cyclonedx-json
          output-file: artifacts/patchpony-gateway.cdx.json

      - name: Generate worker CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: patchpony-worker:ci
          format: cyclonedx-json
          output-file: artifacts/patchpony-worker.cdx.json

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchpony-supply-chain-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/nuget-vulnerabilities.json
            artifacts/patchpony-gateway.cdx.json
            artifacts/patchpony-worker.cdx.json