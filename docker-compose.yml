services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchpony}
      POSTGRES_USER: ${POSTGRES_USER:-patchpony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data

  gateway:
    build:
      context: .
      dockerfile: src/PatchPony.Gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Local Compose is deliberately Development so the internal Swagger UI is available via Caddy.
      ASPNETCORE_ENVIRONMENT: ${PATCHPONY_ASPNETCORE_ENVIRONMENT:-Development}
      # The n8n service account is fail-closed: do not start an integration without its own secret.
      PATCHPONY__AUTH__N8N__TOKEN: ${PATCHPONY__AUTH__N8N__TOKEN:?Set PATCHPONY__AUTH__N8N__TOKEN in .env}
      PATCHPONY__AUTH__N8N__PROJECTS: ${PATCHPONY__AUTH__N8N__PROJECTS:-patchpony,vocavid,one-data}
      # Development-only identity for local Swagger/REST testing; production overlay remains Production.
      PATCHPONY__AUTH__DEVELOPMENTPASSWORD: ${PATCHPONY__AUTH__DEVELOPMENTPASSWORD:-}
      PATCHPONY__AUTH__DEVELOPMENTPROJECTS: ${PATCHPONY__AUTH__DEVELOPMENTPROJECTS:-patchpony,vocavid,one-data}
      PATCHPONY__PILOTSOURCES__PROJECTS__0__ID: patchpony
      PATCHPONY__PILOTSOURCES__PROJECTS__0__CHECKOUTROOT: /sources/patchpony
      PATCHPONY__PILOTSOURCES__PROJECTS__0__MANIFESTFILE: /manifests/patchpony.yaml
      PATCHPONY__PILOTSOURCES__PROJECTS__1__ID: vocavid
      PATCHPONY__PILOTSOURCES__PROJECTS__1__CHECKOUTROOT: /sources/vocavid
      PATCHPONY__PILOTSOURCES__PROJECTS__1__MANIFESTFILE: /manifests/vocavid.yaml
      PATCHPONY__PILOTSOURCES__PROJECTS__2__ID: one-data
      PATCHPONY__PILOTSOURCES__PROJECTS__2__CHECKOUTROOT: /sources/one-data
      PATCHPONY__PILOTSOURCES__PROJECTS__2__MANIFESTFILE: /manifests/one-data.yaml
    volumes:
      # Only manifest-approved source roots are mounted; .env and .git never enter the Gateway container.
      - ./src:/sources/patchpony/src:ro
      - ./tests:/sources/patchpony/tests:ro
      - ./docs:/sources/patchpony/docs:ro
      - ./README.md:/sources/patchpony/README.md:ro
      - ./pilot-sources/VocaVid/VocaVid:/sources/vocavid/VocaVid:ro
      - ./pilot-sources/VocaVid/desktop:/sources/vocavid/desktop:ro
      - ./pilot-sources/VocaVid/docs:/sources/vocavid/docs:ro
      - ./pilot-sources/VocaVid/prompts:/sources/vocavid/prompts:ro
      - ./pilot-sources/VocaVid/templates:/sources/vocavid/templates:ro
      - ./pilot-sources/VocaVid/tests:/sources/vocavid/tests:ro
      - ./pilot-sources/VocaVid/website:/sources/vocavid/website:ro
      - ./pilot-sources/VocaVid/workflows:/sources/vocavid/workflows:ro
      - ./pilot-sources/VocaVid/README.md:/sources/vocavid/README.md:ro
      - ./pilot-sources/VocaVid/requirements.txt:/sources/vocavid/requirements.txt:ro
      - ./pilot-sources/one-data/apps:/sources/one-data/apps:ro
      - ./pilot-sources/one-data/docs:/sources/one-data/docs:ro
      - ./pilot-sources/one-data/packages:/sources/one-data/packages:ro
      - ./pilot-sources/one-data/tools:/sources/one-data/tools:ro
      - ./pilot-sources/one-data/README.md:/sources/one-data/README.md:ro
      - ./pilot-sources/one-data/one-data.slnx:/sources/one-data/one-data.slnx:ro
      - ./integrations/pilot-projects:/manifests:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
      - data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
  worker:
    build:
      context: .
      dockerfile: src/PatchPony.Worker/Dockerfile
    environment:
      PATCHPONY__WORKER__ID: ${PATCHPONY__WORKER__ID:-patchpony-worker-local}
      PATCHPONY__WORKER__CLAIMSIGNINGKEY: ${PATCHPONY__WORKER__CLAIMSIGNINGKEY:?Set PATCHPONY__WORKER__CLAIMSIGNINGKEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: none
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'PatchPony.Worker' /proc/1/cmdline"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  data:
    internal: true
